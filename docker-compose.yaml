    build: ./imageStorageService
    command: ["node", "services/bootstrapBucket.js"]
    restart: "no"
    depends_on:
      seaweedfs:
        condition: service_started
    environment:
      S3_ENDPOINT: "seaweedfs:9000"
      S3_BUCKET: "picturas"
    volumes:
      - ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/s3/bootstrap.json:/run/secrets/s3-bootstrap/credentials.json:ro
      - ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/pki/services/seaweedfs/ca.crt:/run/secrets/pki/ca.crt:ro
