worker_processes 1;
events { worker_connections 256; }
http {
  access_log /dev/stdout;
  server {
    listen 443 ssl;
    ssl_certificate /pki/front.crt;
    ssl_certificate_key /pki/front.key;
    location / {
      proxy_pass https://frontend:3000;
      proxy_ssl_verify on;
      proxy_ssl_trusted_certificate /pki/ca.crt;
      proxy_ssl_name frontend;
      proxy_ssl_server_name on;
      proxy_ssl_session_reuse off;
      proxy_ssl_certificate /pki/nginx.crt;
      proxy_ssl_certificate_key /pki/nginx.key;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /no-client-cert/ {
      proxy_pass https://frontend:3000/;
      proxy_ssl_verify on;
      proxy_ssl_trusted_certificate /pki/ca.crt;
      proxy_ssl_name frontend;
      proxy_ssl_server_name on;
      proxy_ssl_session_reuse off;
    }
    location /wrong-name/ {
      proxy_pass https://frontend:3000/;
      proxy_ssl_verify on;
      proxy_ssl_trusted_certificate /pki/ca.crt;
      proxy_ssl_name api_gateway;
      proxy_ssl_server_name on;
      proxy_ssl_session_reuse off;
      proxy_ssl_certificate /pki/nginx.crt;
      proxy_ssl_certificate_key /pki/nginx.key;
    }
  }
}
