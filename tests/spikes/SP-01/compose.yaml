name: picturas-spike
x-py: &py
  image: python:3.11-slim
  command: ["python", "-u", "/app/srv.py"]
  volumes: ["./srv.py:/app/srv.py:ro", "./pki:/pki:ro"]
services:
  nginx:
    image: nginx@sha256:84f7876d21d154885f99554d7ae325d8c2213f9169726ea7ab60642f2573a787
    ports: ["127.0.0.1:18443:443"]
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro", "./pki:/pki:ro"]
    depends_on: [auth, sink, backend, rogue]
  auth: {<<: *py, environment: {MODE: auth}}
  sink: {<<: *py, environment: {MODE: sink}}
  backend: {<<: *py, environment: {MODE: tls, PORT: "9443", CERT: /pki/backend.crt, KEY: /pki/backend.key, CA: /pki/ca.crt}}
  rogue: {<<: *py, environment: {MODE: tls, PORT: "9443", CERT: /pki/rogue.crt, KEY: /pki/rogue.key, CA: /pki/ca.crt}}
