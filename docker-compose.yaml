      context: ./Tools
      dockerfile: upgrade_ai/Dockerfile
    env_file: ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/env/upgrade_ai_tool.env
    networks:
      - elk
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: on-failure
    volumes:
      - image_data:/app/images
      - ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/pki/services/rabbitmq/ca.crt:/run/secrets/pki/ca.crt:ro

  generative-mock:
    build: ./generative-mock
    restart: on-failure
    networks:
      - elk
    volumes:
      - ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/pki/services/generative-mock:/run/secrets/pki:ro
    # HTTPS with the installation CA, the expected name and the service's own client
    # certificate; the peer allowlist answers 403 to it, which proves the server serves.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import ssl,sys,http.client as h;d='/run/secrets/pki/';c=ssl.create_default_context(cafile=d+'ca.crt');c.load_cert_chain(d+'service.crt',d+'service.key');x=h.HTTPSConnection('generative-mock',7860,context=c,timeout=3);x.request('GET','/sdapi/v1/samplers');sys.exit(0 if x.getresponse().status<500 else 1)"
        ]
      interval: 5s
      timeout: 3s
      retries: 30

  expand_ai_tool:
    build:
      context: ./Tools
      dockerfile: expand_ai/Dockerfile
    env_file: ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/env/expand_ai_tool.env
    networks:
      - elk
    depends_on:
      rabbitmq:
        condition: service_healthy
      generative-mock:
        condition: service_healthy
    restart: on-failure
    volumes:
      - image_data:/app/images
      - ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/pki/services/expand_ai_tool:/run/secrets/pki:ro
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5671
      - GEN_EXPAND_URL=https://generative-mock:7860
      
  watermark_tool_ms:
    build: ./Tools/watermark
    restart: always
    environment:
      - RABBITMQ_REQUESTS_QUEUE_NAME=watermark_queue
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5671
      - RABBITMQ_TLS_CA_FILE=/run/secrets/pki/ca.crt
      - RABBITMQ_TLS_SERVER_NAME=rabbitmq
      - PICTURAS_LOG_LEVEL=INFO  # change / remove in production
      - RABBITMQ_RESULTS_EXCHANGE=picturas
      - RABBITMQ_RESULTS_ROUTING_KEY=project_queue
    env_file: ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/env/watermark_tool_ms.env
    networks:
      - elk
    volumes:
      - image_data:/images
      - ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/pki/services/rabbitmq/ca.crt:/run/secrets/pki/ca.crt:ro
    depends_on:
      rabbitmq:
        condition: service_healthy

  frontend:
    build: ./frontend
    init: true
    restart: on-failure
    networks:
      - elk
    environment:
    - NEXT_PUBLIC_API_BASE_URL=/api-gateway/
    volumes:
      - ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/pki/services/frontend:/run/secrets/pki:ro
    healthcheck:
      <<: *node-health-timing
      test: ["CMD", "node", "-e", *node-health-js, "frontend", "3000", "https"]

  ws_gateway:
    build: ./wsGateway
    command: ["node", "index.js"]
    init: true
    restart: on-failure
    mem_limit: 512m
    healthcheck:
      <<: *node-health-timing
      test: ["CMD", "node", "-e", *node-health-js, "ws_gateway", "4000", "https", "/socket.io/"]
    env_file: ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/env/ws_gateway.env
    networks:
      - elk
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5671
    volumes:
      - ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/pki/services/ws_gateway:/run/secrets/pki:ro

  mongo-backup:
    image: mongo:4.4
    restart: on-failure
    depends_on:
      - users_mongoDB
      - projects_mongoDB
      - subscriptions_mongoDB
    volumes:
      - ./backups/mongo:/backups
      - ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/mongo-backup:/run/secrets/mongo-backup:ro
      - ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/pki/services/projects_mongoDB/ca.crt:/run/secrets/pki/ca.crt:ro
    networks:
      - elk
    command: >
      bash -c '
        set -e;
        echo "[mongo-backup] container started";
        while true; do
          echo "[mongo-backup] starting daily backup...";
          TS=$(date +"%F-%H%M");

          echo "[mongo-backup] timestamp = $${TS}";

          mongodump \
            --config /run/secrets/mongo-backup/users.yaml \
            --host users_mongoDB \
            --port 27019 \
            --username backup_ro --authenticationDatabase admin \
            --ssl --sslCAFile /run/secrets/pki/ca.crt --db user \
            --archive=/backups/users-$${TS}.gz \
            --gzip;

          mongodump \
            --config /run/secrets/mongo-backup/projects.yaml \
            --host projects_mongoDB \
            --port 27018 \
            --username backup_ro --authenticationDatabase admin \
            --ssl --sslCAFile /run/secrets/pki/ca.crt --db project \
            --archive=/backups/projects-$${TS}.gz \
            --gzip;

          mongodump \
            --config /run/secrets/mongo-backup/subscriptions.yaml \
            --host subscriptions_mongoDB \
            --username backup_ro --authenticationDatabase admin \
            --ssl --sslCAFile /run/secrets/pki/ca.crt --db subscription \
            --archive=/backups/subscriptions-$${TS}.gz \
            --gzip;

          echo "[mongo-backup] backup finished, sleeping 24h...";
          sleep 86400;
        done
      '

networks:
  elk:
    driver: bridge

volumes:
  whisper_models:
  rabbitmq_data:
  project_data:
  user_data:
  image_data:
  seaweedfs_data:
  subscription_data:
