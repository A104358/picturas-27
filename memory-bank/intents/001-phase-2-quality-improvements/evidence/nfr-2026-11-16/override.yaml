# Isolated measurement stack (project picturas-nfr). Loopback ports shifted so
# the user's other running deployment is untouched.
services:
  nginx:
    ports: !override ["127.0.0.1:28080:443"]
  seaweedfs:
    ports: !override ["127.0.0.1:29000:9000"]
  img_storage:
    ports: !override ["127.0.0.1:31000:11000"]
    environment:
      FRONTEND_URL: "https://localhost:28080"
    cpus: 2
    mem_limit: 2g
  rabbitmq:
    ports: !override ["127.0.0.1:25672:5672", "127.0.0.1:35672:15672"]
  projects_mongoDB:
    ports: !override ["127.0.0.1:47018:27018"]
  users_mongoDB:
    ports: !override ["127.0.0.1:47019:27019"]
  projects:
    ports: !override ["127.0.0.1:29002:9001"]
    cpus: 2
    mem_limit: 2g
  users:
    ports: !override ["127.0.0.1:30001:10001"]
  api_gateway:
    ports: !override ["127.0.0.1:28000:8000"]
    cpus: 2
    mem_limit: 2g
  ws_gateway:
    ports: !override ["127.0.0.1:24000:4000"]
    networks:
      elk:
        aliases: [frontend]
  video_tool:
    cpus: 2
    mem_limit: 2g
