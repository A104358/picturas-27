# Fixed project name: container names are picturas-<service>-<n>, independent of the
# directory this repository was cloned into. Override with `docker compose -p <name>`.
name: picturas

services:
  # elasticsearch:
  #   image: docker.elastic.co/elasticsearch/elasticsearch:7.6.2
  #   environment:
  #     - discovery.type=single-node
  #   ports:
  #     - 9200:9200
  #   networks:
  #     - elk
  #
  # logstash:
  #   image: docker.elastic.co/logstash/logstash:7.6.2
  #   ports:
  #     - "12201:12201/udp"
  #   volumes:
  #     - ./logstash.conf:/etc/logstash/logstash.conf
  #   command: logstash -f /etc/logstash/logstash.conf
  #   networks:
  #     - elk
  #   depends_on:
  #     - elasticsearch
  #
  # kibana:
  #   image: docker.elastic.co/kibana/kibana:7.6.2
  #   ports:
  #     - 5601:5601
  #   # volumes:
  #   #   - ./kibana_data:/usr/share/kibana/data
  #   networks:
  #     - elk
  #   depends_on:
  #     - elasticsearch
  #     - logstash

  nginx:
    image: nginx@sha256:84f7876d21d154885f99554d7ae325d8c2213f9169726ea7ab60642f2573a787
    ports:
      - "8080:443"
    networks:
      - elk
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/pki/services/nginx:/etc/nginx/pki:ro
    depends_on:
      - api_gateway
      - ws_gateway
      - seaweedfs

  # S3-compatible object storage.
  # Replaces MinIO, whose Docker images were withdrawn from Docker Hub and quay.io in 2026.
  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    restart: on-failure
    command: >
      server -dir=/data -ip=localhost -ip.bind=127.0.0.1
      -s3 -s3.port=9000 -s3.ip.bind=0.0.0.0
      -s3.cert.file=/run/secrets/pki/service.crt
      -s3.key.file=/run/secrets/pki/service.key
      -s3.config=/etc/seaweedfs/s3.json
      -s3.port.iceberg=0 -s3.port.lance=0
      -s3.encryptVolumeData
      -master.volumeSizeLimitMB=1024
    ports:
      - "9000:9000"
    volumes:
      - seaweedfs_data:/data
      - ./seaweedfs/security.toml:/etc/seaweedfs/security.toml:ro
      - ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/s3/s3.json:/etc/seaweedfs/s3.json:ro
      - ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/pki/services/seaweedfs:/run/secrets/pki:ro
    env_file: ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/env/seaweedfs.env
    networks:
      - elk

  s3-bootstrap:
    build: ./imageStorageService
    command: ["node", "services/bootstrapBucket.js"]
    restart: "no"
    depends_on:
      seaweedfs:
        condition: service_started
    environment:
      S3_ENDPOINT: "seaweedfs:9000"
      S3_BUCKET: "picturas"
    volumes:
      - ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/s3/bootstrap.json:/run/secrets/s3-bootstrap/credentials.json:ro
      - ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/pki/services/seaweedfs/ca.crt:/run/secrets/pki/ca.crt:ro
    networks:
      - elk

  img_storage:
    build: ./imageStorageService
    restart: on-failure
    depends_on:
      s3-bootstrap:
        condition: service_completed_successfully
    ports:
      - "11000:11000"
    environment:
      S3_ENDPOINT: "seaweedfs:9000"
      FRONTEND_URL: "https://localhost:8080"
    env_file: ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/env/img_storage.env
    networks:
      - elk
    volumes:
      - ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/pki/services/img_storage:/run/secrets/pki:ro

  rabbitmq:
    build:
      context: ./rabbitMQ
    restart: on-failure
    env_file: ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/env/rabbitmq.env
    ports:
      - "5671:5671"
      - "15671:15671"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/pki/services/rabbitmq:/run/secrets/pki:ro
    healthcheck:
      test: ["CMD-SHELL", "rabbitmqctl status"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - elk

  projects_mongoDB:
    image: mongo:4.4
    restart: on-failure
    networks:
      - elk
    entrypoint: ["/bin/sh", "/usr/local/bin/mongo-tls-entrypoint.sh"]
    command: ["--port", "27018"]
    env_file: ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/env/projects_mongoDB.env
    ports:
      - "27018:27018"
    healthcheck:
      test: ["CMD", "mongo", "--host", "projects_mongoDB", "--port", "27018", "--tls", "--tlsCAFile", "/run/secrets/pki/ca.crt", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    tmpfs:
      - /tmp
    volumes:
      - project_data:/data/db
      - ./ops/mongo-tls-entrypoint.sh:/usr/local/bin/mongo-tls-entrypoint.sh:ro
      - ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/pki/services/projects_mongoDB:/run/secrets/pki:ro
      - ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/mongo/projects/init.js:/docker-entrypoint-initdb.d/init.js:ro

  projects:
    build: ./projects
    depends_on:
      rabbitmq:
        condition: service_healthy
      projects_mongoDB:
        condition: service_started
    ports:
      - "9002:9001"
    restart: on-failure
    environment:
      INTERNAL_SERVICE_NAME: projects
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5671
      # Per-profile video limits
      VIDEO_FREE_MAX_DURATION_S: 60
      VIDEO_FREE_MAX_SIZE_MB: 100
      VIDEO_PREMIUM_MAX_DURATION_S: 600
      VIDEO_PREMIUM_MAX_SIZE_MB: 1024
    env_file: ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/env/projects.env
    networks:
      - elk
    volumes:
      - image_data:/app/images
      - ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/pki/services/projects:/run/secrets/pki:ro
      - ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/jwt/rs256-public.pem:/run/secrets/jwt/rs256-public.pem:ro

  users_mongoDB:
    image: mongo:4.4
    restart: on-failure
    networks:
      - elk
    entrypoint: ["/bin/sh", "/usr/local/bin/mongo-tls-entrypoint.sh"]
    command: ["--port", "27019"]
    env_file: ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/env/users_mongoDB.env
    ports:
      - "27019:27019"
    healthcheck:
      test: ["CMD", "mongo", "--host", "users_mongoDB", "--port", "27019", "--tls", "--tlsCAFile", "/run/secrets/pki/ca.crt", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    tmpfs:
      - /tmp
    volumes:
      - user_data:/data/db
      - ./ops/mongo-tls-entrypoint.sh:/usr/local/bin/mongo-tls-entrypoint.sh:ro
      - ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/pki/services/users_mongoDB:/run/secrets/pki:ro
      - ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/mongo/users/init.js:/docker-entrypoint-initdb.d/init.js:ro

  users:
    build: ./users
    depends_on:
      - users_mongoDB
    ports:
      - "10001:10001"
    restart: on-failure
    environment:
      - INTERNAL_SERVICE_NAME=users
      - FREE_DAILY_OP=5
    env_file: ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/env/users.env
    networks:
      - elk
    volumes:
      - ./users:/app
      - /app/node_modules
      - ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/pki/services/users:/run/secrets/pki:ro
      - ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/jwt/rs256-public.pem:/run/secrets/jwt/rs256-public.pem:ro

  subscriptions_mongoDB:
    image: mongo:4.4
    restart: on-failure
    networks:
      - elk
    entrypoint: ["/bin/sh", "/usr/local/bin/mongo-tls-entrypoint.sh"]
    command: ["--port", "27017"]
    env_file: ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/env/subscriptions_mongoDB.env
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongo", "--host", "subscriptions_mongoDB", "--port", "27017", "--tls", "--tlsCAFile", "/run/secrets/pki/ca.crt", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    tmpfs:
      - /tmp
    volumes:
      - subscription_data:/data/db
      - ./ops/mongo-tls-entrypoint.sh:/usr/local/bin/mongo-tls-entrypoint.sh:ro
      - ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/pki/services/subscriptions_mongoDB:/run/secrets/pki:ro
      - ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/mongo/subscriptions/init.js:/docker-entrypoint-initdb.d/init.js:ro

  subscriptions:
    build: ./subscriptions
    depends_on:
      - subscriptions_mongoDB
      - users
    ports:
      - "11001:11001"
    restart: on-failure
    environment:
      INTERNAL_SERVICE_NAME: subscriptions
    env_file: ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/env/subscriptions.env
    networks:
      - elk
    volumes:
      - ./subscriptions:/app
      - /app/node_modules
      - ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/pki/services/subscriptions:/run/secrets/pki:ro
      - ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/jwt/rs256-public.pem:/run/secrets/jwt/rs256-public.pem:ro

  api_gateway:
    build: ./apiGateway
    depends_on:
      - projects
      - users
    restart: on-failure
    env_file: ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/env/api_gateway.env
    networks:
      - elk
    volumes:
      - ./apiGateway:/app
      - /app/node_modules
      - ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/pki/services/api_gateway:/run/secrets/pki:ro
      - ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/jwt/rs256-private.pem:/run/secrets/jwt/rs256-private.pem:ro

  bg_remove_ai_tool:
    build:
      context: ./Tools
      dockerfile: bg_remove_ai/Dockerfile
    restart: on-failure
    env_file: ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/env/bg_remove_ai_tool.env
    networks:
      - elk
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - image_data:/app/images
      - ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/pki/services/rabbitmq/ca.crt:/run/secrets/pki/ca.crt:ro

  binarization_tool:
    build:
      context: ./Tools
      dockerfile: binarization/Dockerfile
    restart: on-failure
    env_file: ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/env/binarization_tool.env
    networks:
      - elk
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - image_data:/app/images
      - ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/pki/services/rabbitmq/ca.crt:/run/secrets/pki/ca.crt:ro

  # Video worker (ffmpeg isolated in the container)
  video_tool:
    build:
      context: ./Tools
      dockerfile: video/Dockerfile
    restart: on-failure
    environment:
      VIDEO_PREVIEW_SECONDS: 3
      WHISPER_MODEL: small
      WHISPER_CACHE_DIR: /models/whisper
      WHISPER_CPU_THREADS: 2
    env_file: ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/env/video_tool.env
    networks:
      - elk
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - image_data:/app/images
      - ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/pki/services/rabbitmq/ca.crt:/run/secrets/pki/ca.crt:ro
      - whisper_models:/models/whisper

  border_tool:
    build:
      context: ./Tools
      dockerfile: border/Dockerfile
    restart: on-failure
    env_file: ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/env/border_tool.env
    networks:
      - elk
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - image_data:/app/images
      - ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/pki/services/rabbitmq/ca.crt:/run/secrets/pki/ca.crt:ro

  brightness_tool:
    build:
      context: ./Tools
      dockerfile: brightness/Dockerfile
    restart: on-failure
    env_file: ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/env/brightness_tool.env
    networks:
      - elk
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - image_data:/app/images
      - ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/pki/services/rabbitmq/ca.crt:/run/secrets/pki/ca.crt:ro

  contrast_tool:
    build:
      context: ./Tools
      dockerfile: contrast/Dockerfile
    restart: on-failure
    env_file: ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/env/contrast_tool.env
    networks:
      - elk
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - image_data:/app/images
      - ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/pki/services/rabbitmq/ca.crt:/run/secrets/pki/ca.crt:ro

  cut_tool:
    build:
      context: ./Tools
      dockerfile: cut/Dockerfile
    restart: on-failure
    env_file: ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/env/cut_tool.env
    networks:
      - elk
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - image_data:/app/images
      - ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/pki/services/rabbitmq/ca.crt:/run/secrets/pki/ca.crt:ro

  cut_ai_tool:
    build:
      context: ./Tools
      dockerfile: cut_ai/Dockerfile
    env_file: ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/env/cut_ai_tool.env
    networks:
      - elk
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: on-failure
    volumes:
      - image_data:/app/images
      - ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/pki/services/rabbitmq/ca.crt:/run/secrets/pki/ca.crt:ro

  people_ai_tool:
    build: 
      context: ./Tools
      dockerfile: people_ai/Dockerfile
    env_file: ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/env/people_ai_tool.env
    networks:
      - elk
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: on-failure
    volumes:
      - image_data:/app/images
      - ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/pki/services/rabbitmq/ca.crt:/run/secrets/pki/ca.crt:ro

  obj_ai_tool:
    build: 
      context: ./Tools
      dockerfile: obj_ai/Dockerfile
    env_file: ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/env/obj_ai_tool.env
    networks:
      - elk
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: on-failure
    volumes:
      - image_data:/app/images
      - ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/pki/services/rabbitmq/ca.crt:/run/secrets/pki/ca.crt:ro

  resize_tool:
    build:
      context: ./Tools
      dockerfile: resize/Dockerfile
    restart: on-failure
    env_file: ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/env/resize_tool.env
    networks:
      - elk
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - image_data:/app/images
      - ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/pki/services/rabbitmq/ca.crt:/run/secrets/pki/ca.crt:ro

  rotate_tool:
    build:
      context: ./Tools
      dockerfile: rotate/Dockerfile
    restart: on-failure
    env_file: ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/env/rotate_tool.env
    networks:
      - elk
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - image_data:/app/images
      - ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/pki/services/rabbitmq/ca.crt:/run/secrets/pki/ca.crt:ro

  saturation_tool:
    build:
      context: ./Tools
      dockerfile: saturation/Dockerfile
    restart: on-failure
    env_file: ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/env/saturation_tool.env
    networks:
      - elk
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - image_data:/app/images
      - ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/pki/services/rabbitmq/ca.crt:/run/secrets/pki/ca.crt:ro

  text_ai_tool:
    build:
      context: ./Tools
      dockerfile: text_ai/Dockerfile
    env_file: ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/env/text_ai_tool.env
    networks:
      - elk
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: on-failure
    volumes:
      - image_data:/app/images
      - ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/pki/services/rabbitmq/ca.crt:/run/secrets/pki/ca.crt:ro

  upgrade_ai_tool:
    build:
      context: ./Tools
      dockerfile: upgrade_ai/Dockerfile
    env_file: ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/env/upgrade_ai_tool.env
    networks:
      - elk
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: on-failure
    volumes:
      - image_data:/app/images
      - ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/pki/services/rabbitmq/ca.crt:/run/secrets/pki/ca.crt:ro

  generative-mock:
    build: ./generative-mock
    ports:
      - "7860:7860"
    networks:
      - elk
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:7860/sdapi/v1/samplers').read()\""
        ]
      interval: 5s
      timeout: 3s
      retries: 30

  expand_ai_tool:
    build:
      context: ./Tools
      dockerfile: expand_ai/Dockerfile
    env_file: ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/env/expand_ai_tool.env
    networks:
      - elk
    depends_on:
      rabbitmq:
        condition: service_healthy
      generative-mock:
        condition: service_healthy
    restart: on-failure
    volumes:
      - image_data:/app/images
      - ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/pki/services/rabbitmq/ca.crt:/run/secrets/pki/ca.crt:ro
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5671
      - GEN_EXPAND_URL=http://generative-mock:7860
      
  watermark_tool_ms:
    build: ./Tools/watermark
    restart: always
    environment:
      - RABBITMQ_REQUESTS_QUEUE_NAME=watermark_queue
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5671
      - RABBITMQ_TLS_CA_FILE=/run/secrets/pki/ca.crt
      - RABBITMQ_TLS_SERVER_NAME=rabbitmq
      - PICTURAS_LOG_LEVEL=INFO  # change / remove in production
      - RABBITMQ_RESULTS_EXCHANGE=picturas
      - RABBITMQ_RESULTS_ROUTING_KEY=project_queue
    env_file: ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/env/watermark_tool_ms.env
    networks:
      - elk
    volumes:
      - image_data:/images
      - ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/pki/services/rabbitmq/ca.crt:/run/secrets/pki/ca.crt:ro
    depends_on:
      rabbitmq:
        condition: service_healthy

  frontend:
    build: ./frontend
    networks:
      - elk
    environment:
    - NEXT_PUBLIC_API_BASE_URL=/api-gateway/
    volumes:
      - ./frontend:/app
      - /app/node_modules

  ws_gateway:
    build: ./wsGateway
    restart: on-failure
    env_file: ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/env/ws_gateway.env
    networks:
      - elk
    ports:
      - "4000:4000"
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5671
    volumes:
      - ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/pki/services/rabbitmq/ca.crt:/run/secrets/pki/ca.crt:ro

  mongo-backup:
    image: mongo:4.4
    restart: on-failure
    depends_on:
      - users_mongoDB
      - projects_mongoDB
      - subscriptions_mongoDB
    volumes:
      - ./backups/mongo:/backups
      - ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/mongo-backup:/run/secrets/mongo-backup:ro
      - ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/pki/services/projects_mongoDB/ca.crt:/run/secrets/pki/ca.crt:ro
    networks:
      - elk
    command: >
      bash -c '
        set -e;
        echo "[mongo-backup] container started";
        while true; do
          echo "[mongo-backup] starting daily backup...";
          TS=$(date +"%F-%H%M");

          echo "[mongo-backup] timestamp = $${TS}";

          mongodump \
            --config /run/secrets/mongo-backup/users.yaml \
            --host users_mongoDB \
            --port 27019 \
            --username backup_ro --authenticationDatabase admin \
            --ssl --sslCAFile /run/secrets/pki/ca.crt --db user \
            --archive=/backups/users-$${TS}.gz \
            --gzip;

          mongodump \
            --config /run/secrets/mongo-backup/projects.yaml \
            --host projects_mongoDB \
            --port 27018 \
            --username backup_ro --authenticationDatabase admin \
            --ssl --sslCAFile /run/secrets/pki/ca.crt --db project \
            --archive=/backups/projects-$${TS}.gz \
            --gzip;

          mongodump \
            --config /run/secrets/mongo-backup/subscriptions.yaml \
            --host subscriptions_mongoDB \
            --username backup_ro --authenticationDatabase admin \
            --ssl --sslCAFile /run/secrets/pki/ca.crt --db subscription \
            --archive=/backups/subscriptions-$${TS}.gz \
            --gzip;

          echo "[mongo-backup] backup finished, sleeping 24h...";
          sleep 86400;
        done
      '

networks:
  elk:
    driver: bridge

volumes:
  whisper_models:
  rabbitmq_data:
  project_data:
  user_data:
  image_data:
  seaweedfs_data:
  subscription_data:
