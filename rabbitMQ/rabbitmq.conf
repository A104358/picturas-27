auth_mechanisms.1 = PLAIN
auth_backends.1 = rabbit_auth_backend_internal
loopback_users.guest = true
listeners.tcp = none
listeners.ssl.default = 5671
ssl_options.cacertfile = /run/secrets/pki/ca.crt
ssl_options.certfile = /run/secrets/pki/service.crt
ssl_options.keyfile = /run/secrets/pki/service.key
ssl_options.verify = verify_none
ssl_options.fail_if_no_peer_cert = false
management.ssl.port = 15671
management.ssl.cacertfile = /run/secrets/pki/ca.crt
management.ssl.certfile = /run/secrets/pki/service.crt
management.ssl.keyfile = /run/secrets/pki/service.key
prometheus.tcp.ip = 127.0.0.1
management.load_definitions = /etc/rabbitmq/definitions.json

