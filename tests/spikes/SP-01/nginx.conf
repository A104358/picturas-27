worker_processes 1;
events { worker_connections 256; }
http {
  log_format spike '$request_method $uri $status rt=$request_time';
  access_log /dev/stdout spike;
  client_max_body_size 1m;
  resolver 127.0.0.11 valid=10s ipv6=off;
  server {
    listen 443 ssl;
    ssl_certificate /pki/front.crt;
    ssl_certificate_key /pki/front.key;

    location = /_auth {
      internal;
      client_max_body_size 1100m;
      proxy_set_header X-Original-Method $request_method;
      proxy_pass http://auth:9000/check;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header X-Original-URI $request_uri;
      proxy_set_header X-Original-Length $content_length;
      proxy_set_header Authorization $http_authorization;
      proxy_read_timeout 2s;
      proxy_connect_timeout 1s;
    }
    # streaming + auth_request (B7 shape)
    location /uploads/ {
      client_max_body_size 1100m;
      auth_request /_auth;
      auth_request_set $upload_key $upstream_http_x_upload_key;
      proxy_request_buffering off;
      proxy_http_version 1.1;
      proxy_next_upstream off;
      set $sink_host sink;
      proxy_set_header X-Upload-Key $upload_key;
      proxy_pass http://$sink_host:9000;
    }
    # status mapping for auth_request denials (403 + X-Deny-Status -> real code)
    location /mapped/ {
      client_max_body_size 1100m;
      auth_request /_auth;
      auth_request_set $deny_status $upstream_http_x_deny_status;
      error_page 403 = @auth_denied;
      proxy_request_buffering off;
      proxy_http_version 1.1;
      proxy_pass http://sink:9000;
    }
    location @auth_denied {
      proxy_request_buffering off;
      proxy_method GET;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_pass http://auth:9000/denied/$deny_status;
    }
    # streaming to a verified TLS upstream with client cert
    location /uploads-tls/ {
      client_max_body_size 1100m;
      auth_request /_auth;
      proxy_request_buffering off;
      proxy_http_version 1.1;
      proxy_pass https://backend:9443;
      proxy_ssl_verify on;
      proxy_ssl_trusted_certificate /pki/ca.crt;
      proxy_ssl_name backend;
      proxy_ssl_server_name on;
      proxy_ssl_certificate /pki/nginx-client.crt;
      proxy_ssl_certificate_key /pki/nginx-client.key;
    }
    # variant B: denial mapped with literal returns (no upstream)
    location /mapped-return/ {
      client_max_body_size 1100m;
      auth_request /_auth;
      auth_request_set $deny_status $upstream_http_x_deny_status;
      error_page 403 = @auth_denied_return;
      proxy_request_buffering off;
      proxy_http_version 1.1;
      proxy_pass http://sink:9000;
    }
    location @auth_denied_return {
      default_type application/json;
      if ($deny_status = 409) { return 409 '{"error":"conflict"}'; }
      if ($deny_status = 410) { return 410 '{"error":"gone"}'; }
      if ($deny_status = 411) { return 411 '{"error":"length required"}'; }
      if ($deny_status = 413) { return 413 '{"error":"too large"}'; }
      if ($deny_status = 429) { return 429 '{"error":"too many"}'; }
      if ($deny_status = 503) { return 503 '{"error":"unavailable"}'; }
      if ($deny_status = 404) { return 404 '{"error":"not found"}'; }
      return 403 '{"error":"forbidden"}';
    }
    # control: default buffering
    location /buffered/ {
      client_max_body_size 1100m;
      proxy_http_version 1.1;
      proxy_pass http://sink:9000;
    }
    # TLS to upstream, verified, with nginx client cert (mTLS)
    location /tls-ok/ {
      proxy_pass https://backend:9443;
      proxy_ssl_verify on;
      proxy_ssl_verify_depth 2;
      proxy_ssl_trusted_certificate /pki/ca.crt;
      proxy_ssl_name backend;
      proxy_ssl_server_name on;
      proxy_ssl_certificate /pki/nginx-client.crt;
      proxy_ssl_certificate_key /pki/nginx-client.key;
      proxy_ssl_session_reuse off;
    }
    location /tls-wrongname/ {
      proxy_pass https://backend:9443;
      proxy_ssl_verify on;
      proxy_ssl_trusted_certificate /pki/ca.crt;
      proxy_ssl_name projects;
      proxy_ssl_server_name on;
      proxy_ssl_certificate /pki/nginx-client.crt;
      proxy_ssl_certificate_key /pki/nginx-client.key;
    }
    location /tls-untrusted/ {
      proxy_pass https://rogue:9443;
      proxy_ssl_verify on;
      proxy_ssl_trusted_certificate /pki/ca.crt;
      proxy_ssl_name rogue;
      proxy_ssl_server_name on;
      proxy_ssl_certificate /pki/nginx-client.crt;
      proxy_ssl_certificate_key /pki/nginx-client.key;
    }
    location /tls-noclientcert/ {
      proxy_pass https://backend:9443;
      proxy_ssl_verify on;
      proxy_ssl_trusted_certificate /pki/ca.crt;
      proxy_ssl_name backend;
      proxy_ssl_server_name on;
    }
    # control: verification off accepts the rogue upstream
    location /tls-verify-off/ {
      proxy_pass https://rogue:9443;
      proxy_ssl_certificate /pki/nginx-client.crt;
      proxy_ssl_certificate_key /pki/nginx-client.key;
    }
  }
}
