# Fixed project name: container names are picturas-<service>-<n>, independent of the
# directory this repository was cloned into. Override with `docker compose -p <name>`.
name: picturas

# Supervision of the Node services (B3, D-04): they run `node` directly (no nodemon; see
# docker-compose.dev.yaml for development), so a dead process exits and `restart` brings
# it back. The healthcheck sends one request to the service itself over HTTPS (B5), with
# the installation CA, the expected server name and the service's own client certificate;
# any answer below 500 (the peer allowlist's 403 included) means the process serves.
# Arguments: <TLS server name> <port> <http|https> [path].
x-node-health-js: &node-health-js >-
  const f=require('fs'),[,n,p,s,u]=process.argv,d='/run/secrets/pki/',
  o={host:'127.0.0.1',port:+p,path:u||'/',timeout:4000};
  if(s==='https')Object.assign(o,{servername:n,ca:f.readFileSync(d+'ca.crt'),
  cert:f.readFileSync(d+'service.crt'),key:f.readFileSync(d+'service.key')});
  require(s).get(o,r=>process.exit(r.statusCode<500?0:1))
  .on('timeout',()=>process.exit(1)).on('error',()=>process.exit(1))

x-node-health-timing: &node-health-timing
  interval: 15s
  timeout: 5s
  retries: 3
  start_period: 60s
  start_interval: 2s

