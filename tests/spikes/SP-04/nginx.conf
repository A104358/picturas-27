worker_processes 1;
events { worker_connections 256; }
http {
  log_format spike '$request_method $uri $status rt=$request_time up=$upstream_status';
  access_log /dev/stdout spike;
  client_max_body_size 1m;
  resolver 127.0.0.11 valid=10s ipv6=off;
  proxy_ssl_verify on;
  proxy_ssl_trusted_certificate /pki/ca.crt;
  proxy_ssl_name seaweedfs;
  proxy_ssl_server_name on;
  server {
    listen 443 ssl;
    ssl_certificate /pki/front.crt;
    ssl_certificate_key /pki/front.key;
    location = /_auth {
      internal;
      client_max_body_size 1100m;
      proxy_pass http://signer:9000/check;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header X-Original-URI $request_uri;
      proxy_set_header X-Original-Length $content_length;
    }
    # B7 shape: Host = signed internal host, client Authorization removed
    location /uploads/ {
      client_max_body_size 1100m;
      auth_request /_auth;
      auth_request_set $s3_uri $upstream_http_x_upload_uri;
      proxy_request_buffering off;
      proxy_http_version 1.1;
      proxy_next_upstream off;
      proxy_set_header Host seaweedfs:9000;
      proxy_set_header Authorization "";
      proxy_pass https://seaweedfs:9000$s3_uri;
    }
    # variant: client Authorization (Bearer JWT) forwarded to S3
    location /uploads-keepauth/ {
      client_max_body_size 1100m;
      auth_request /_auth;
      auth_request_set $s3_uri $upstream_http_x_upload_uri;
      proxy_request_buffering off;
      proxy_http_version 1.1;
      proxy_set_header Host seaweedfs:9000;
      proxy_pass https://seaweedfs:9000$s3_uri;
    }
    # variant: public Host forwarded (what /s3/ does today)
    location /uploads-publichost/ {
      client_max_body_size 1100m;
      auth_request /_auth;
      auth_request_set $s3_uri $upstream_http_x_upload_uri;
      proxy_request_buffering off;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Authorization "";
      proxy_pass https://seaweedfs:9000$s3_uri;
    }
    # /s3/ GET with presigned URL: signed host vs public host
    location /s3/ {
      limit_except GET HEAD { deny all; }
      proxy_pass https://seaweedfs:9000/;
      proxy_set_header Host seaweedfs:9000;
      proxy_http_version 1.1;
    }
    location /s3-publichost/ {
      proxy_pass https://seaweedfs:9000/;
      proxy_set_header Host $host;
      proxy_http_version 1.1;
    }
  }
}
