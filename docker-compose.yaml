  nginx:
    image: nginx@sha256:84f7876d21d154885f99554d7ae325d8c2213f9169726ea7ab60642f2573a787
    ports:
      - "8080:443"
    networks:
      - elk
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/pki/services/nginx:/etc/nginx/pki:ro
    depends_on:
      api_gateway:
        condition: service_healthy
      ws_gateway:
        condition: service_healthy
      seaweedfs:
        condition: service_started
      frontend:
        condition: service_healthy

  # S3-compatible object storage.
  # Replaces MinIO, whose Docker images were withdrawn from Docker Hub and quay.io in 2026.
  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    restart: on-failure
    command: >
      server -dir=/data -ip=localhost -ip.bind=127.0.0.1
      -s3 -s3.port=9000 -s3.ip.bind=0.0.0.0
      -s3.cert.file=/run/secrets/pki/service.crt
      -s3.key.file=/run/secrets/pki/service.key
      -s3.config=/etc/seaweedfs/s3.json
      -s3.port.iceberg=0 -s3.port.lance=0
      -s3.encryptVolumeData
      -master.volumeSizeLimitMB=1024
    volumes:
      - seaweedfs_data:/data
      - ./seaweedfs/security.toml:/etc/seaweedfs/security.toml:ro
      - ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/s3/s3.json:/etc/seaweedfs/s3.json:ro
      - ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/pki/services/seaweedfs:/run/secrets/pki:ro
    env_file: ${PICTURAS_SECRETS_DIR:?PICTURAS_SECRETS_DIR is not set (see ops/secrets.sh)}/env/seaweedfs.env
    networks:
      - elk

