worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    error_log /dev/stderr crit;

    # Local observation only; never published or proxied. Includes buffered bodies.
    server {
        listen 127.0.0.1:8091;
        location = /maintenance-status { stub_status; access_log off; }
    }

    # Decision 28: reuse established mTLS connections; TLS sessions are not resumed.
    upstream api_gateway_pool {
        server api_gateway:8000;
        keepalive 16;
        keepalive_timeout 4s; # Below the Node server's 5-second idle timeout.
    }

    # Allow uploading videos up to the premium profile limit
    client_max_body_size 1100m;

    # 1) Server principal, em HTTPS
    server {
        listen 443 ssl;
        server_name localhost;

        # Evaluated on every new HTTP request, including keep-alive requests.
        # Existing uploads/responses and upgraded WebSockets continue while draining.
        if (-f /run/picturas-maintenance/admissions-closed) { return 503; }

        ssl_certificate     /etc/nginx/pki/service.crt;
        ssl_certificate_key /etc/nginx/pki/service.key;

        # TLS on every hop to the upstreams (Phase 2, B5): the upstream certificate is
        # verified against the installation CA and the expected service name
        # (proxy_ssl_name per location), and nginx presents its own client certificate
        # (frontend, api_gateway and ws_gateway accept only the nginx peer). No session
        # reuse: a resumed session would carry an identity across connections (SP-09).
        proxy_ssl_trusted_certificate /etc/nginx/pki/ca.crt;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_server_name on;
        proxy_ssl_session_reuse off;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_ssl_certificate     /etc/nginx/pki/service.crt;
        proxy_ssl_certificate_key /etc/nginx/pki/service.key;

        # Configuração para o Frontend
        location / {
            proxy_pass https://frontend:3000;
            proxy_ssl_name frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Configuração para o API Gateway
        location /api-gateway/ {
            rewrite ^/api-gateway/(.*)$ /$1 break;
            proxy_pass https://api_gateway_pool;
            proxy_ssl_name api_gateway;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

           # Adicionando cabeçalhos CORS
           add_header 'Access-Control-Allow-Origin' '*' always;
           add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
           add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization, X-Project-Version, X-Caller-Id' always;
           add_header 'Access-Control-Expose-Headers' 'X-Project-Version' always;

            # Reescreve os caminhos para suportar o subpath
            sub_filter 'href="/' 'href="/api-gateway/';
            sub_filter 'src="/' 'src="/api-gateway/';
            sub_filter_once off;

           # Tratando requisições OPTIONS (preflight)
           if ($request_method = 'OPTIONS') {
             add_header 'Access-Control-Allow-Origin' '*';
             add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
             add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization, X-Project-Version, X-Caller-Id';
             add_header 'Access-Control-Max-Age' 3600;
             return 204;
           }

        }

        # Configuração para o WebSocket Gateway
        location /socket.io {
            proxy_pass https://ws_gateway:4000;
            proxy_ssl_name ws_gateway;
    
            # Configurações necessárias para WebSocket
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Timeout para conexões WebSocket
            proxy_connect_timeout 3600s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            # Cabeçalhos adicionais
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # CORS para WebSockets
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Credentials true;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With";

            if ($request_method = 'OPTIONS') {
                return 204;
        }
         }

        # Configuração para o serviço principal de object storage (SeaweedFS S3)
        location /s3/ {
            limit_except GET HEAD { deny all; }
            proxy_pass https://seaweedfs:9000/;
            proxy_ssl_name seaweedfs;
            proxy_set_header Host seaweedfs:9000;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;


            proxy_http_version 1.1;
            proxy_set_header Connection "";
            chunked_transfer_encoding off;

            # Reescreve os caminhos para suportar o subpath
            # sub_filter 'href="/' 'href="/s3/';
            # sub_filter 'src="/' 'src="/s3/';
            # sub_filter_once off;
        }

        location ^~ /s3-console/ { return 404; }

        # # Kibana (porta 5601)
        # location /kibana-service/ {
        #     proxy_pass http://kibana:5601/;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        #
        #     # Reescreve os caminhos para suportar o subpath
        #     sub_filter 'href="/' 'href="/kibana-service/';
        #     sub_filter 'src="/' 'src="/kibana-service/';
        #     sub_filter_once off;
        # }
        #
        #  # Elasticsearch (porta 9200)
        # location /elasticsearch/ {
        #     proxy_pass http://elasticsearch:9200/;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        #
        #     # Reescreve os caminhos para suportar o subpath
        #     sub_filter 'href="/' 'href="/elasticsearch/';
        #     sub_filter 'src="/' 'src="/elasticsearch/';
        #     sub_filter_once off;
        # }
        #
        # # Logstash (porta 12201, interface HTTP)
        # location /logstash/ {
        #     proxy_pass http://logstash:12201/;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        #
        #     # Reescreve os caminhos para suportar o subpath
